version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait before opening PRs so freshly published packages clear the pnpm
    # `minimumReleaseAge` supply-chain policy (~1 day) enforced in CI. Majors
    # get a longer cooldown to let the ecosystem settle before we bump.
    cooldown:
      default-days: 3
      semver-major-days: 7
    # TypeScript 7 is the native port and ships a much smaller JS API than 6.x.
    # svelte-preprocess and svelte-check both still call into the removed APIs
    # and crash on it, so the build breaks. Drop this once they support TS 7.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm_and_yarn:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      docker:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
